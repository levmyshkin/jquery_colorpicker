<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ColorPicker comparison harness</title>
  <link rel="stylesheet" href="/repo/css/colorpicker.css">
  <style>
    body { margin: 0; padding: 20px; font: 14px sans-serif; min-height: 1200px; }
    input.target { width: 120px; }
    #corner { position: absolute; right: 30px; top: 700px; }
    .holder { margin: 20px 0; }
  </style>
</head>
<body>
<div id="stage"></div>
<script>
  // ?impl=original|vanilla &jq=1|3|4|none
  var params = new URLSearchParams(location.search);
  window.IMPL = params.get('impl') || 'vanilla';
  window.JQ = params.get('jq') || '3';
  var scripts = [];
  if (JQ !== 'none') { scripts.push('/vendor/jquery-' + JQ + '.js'); }
  scripts.push(IMPL === 'original' ? '/repo/test/original/colorpicker-1.0.2.js' : '/repo/js/colorpicker.js');
  if (IMPL !== 'original') { scripts.push('/repo/test/api-tests.js'); }
  scripts.push('/repo/test/cases.js');
  (function next() {
    var src = scripts.shift();
    if (!src) { window.READY = true; return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = next;
    s.onerror = function () { window.LOAD_ERROR = src; };
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
